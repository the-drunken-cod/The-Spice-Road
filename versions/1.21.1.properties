# Version-specific build properties for Minecraft 1.21.1
# Copy this file to versions/<new_version>.properties and update the values to target a different MC version.

minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
## NeoForm version for the common module - https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
## ParchmentMC mappings - https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.19.5

# NeoForge
neoforge_version=21.1.256
neoforge_loader_version_range=[4,)

# Cloth Config (Fabric) - https://modrinth.com/mod/cloth-config
cloth_config_version=15.0.140
## Mod Menu - the only way to open a Cloth Config screen on Fabric. Compile-only; not required at runtime.
modmenu_version=11.0.3
## Oldest Mod Menu that provides the ModMenuApi entrypoint we compile against.
modmenu_min_version=11.0.0

# Optional compat mods: oldest supported versions, as declared in their mod metadata.
# Older versions lack the methods Spice Road's compat mixins target, so they're declared incompatible.
farmers_delight_min_version=1.3.0
farmers_delight_refabricated_min_version=1.21.1-3.3.0
cooking_for_blockheads_min_version=21.1.1
# Optional compat mods, compile-only (Modrinth version numbers)
farmers_delight_neoforge_version=1.21.1-1.3.4
farmers_delight_fabric_version=1.21.1-3.3.6
cooking_for_blockheads_neoforge_version=21.1.24+neoforge-1.21.1
cooking_for_blockheads_fabric_version=21.1.24+fabric-1.21.1

# AppleSkin (optional): oldest version with a working FoodValuesEvent (earlier ones fired it twice per tooltip).
appleskin_min_version=3.0.5
# AppleSkin, compile-only (Modrinth version numbers)
appleskin_neoforge_version=3.0.9+mc1.21
appleskin_fabric_version=3.0.6+mc1.21

# Sable Companion.
# a shim bundled directly into our own jar on both loaders (jarJar/include),
# not a compileOnly-probed compat mod like the ones above. Safe with or
# without Sable itself installed. https://github.com/ryanhcode/sable-companion
sable_companion_version=1.6.0

# Misc
credits=
