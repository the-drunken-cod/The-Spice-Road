plugins {
    id 'multiloader-common'
    id 'eclipse'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
    // Resolvable variant of compileOnly for IDE tooling (eclipse/VS Code Gradle model)
    ideCompileOnly {
        canBeResolved = true
        extendsFrom configurations.compileOnly
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

// Expose compileOnly (which includes the :common project) to the Eclipse/VS Code
// classpath model so the Java language server can resolve cross-module imports.
eclipse {
    classpath {
        plusConfigurations += [configurations.ideCompileOnly]
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
