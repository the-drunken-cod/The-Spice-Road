plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // Needed by IMixinConfigPlugin's signatures; both loaders ship ASM at runtime
    compileOnly 'org.ow2.asm:asm-tree:9.7'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.5'

    // Sable Companion.
    // Only lets this module's own standalone compile see the API; fabric/ and
    // neoforge/ each declare their own loader-specific artifact that actually
    // ships the shim at runtime (jarJar/include), since this module's sources
    // are recompiled against each loader's own classpath rather than consumed
    // as a prebuilt jar.
    api "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}


dependencies {
    // The pure logic under test only needs Minecraft's classes on the classpath, not a bootstrapped game.
    testImplementation files(sourceSets.main.compileClasspath)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
